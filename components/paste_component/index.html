<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
    padding: 4px;
  }

  #paste-zone {
    width: 100%;
    min-height: 130px;
    border: 2px dashed #93c5fd;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #64748b;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    background: #f8faff;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2393c5fd' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    user-select: none;
    outline: none;
    position: relative;
  }

  #paste-zone:hover {
    border-color: #3b82f6;
    background: #eff6ff;
  }

  #paste-zone.focused {
    border-color: #2563eb;
    background: #eff6ff;
    color: #2563eb;
  }

  #paste-zone.pasted {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #15803d;
  }

  .icon  { font-size: 2rem; line-height: 1; }
  .hint  { font-size: 0.88rem; font-weight: 600; }
  .sub   { font-size: 0.75rem; opacity: 0.65; }
  .tip   { font-size: 0.72rem; margin-top: 2px; color: #94a3b8; }
  .decor { position: absolute; font-size: 1.3rem; color: #bfdbfe; pointer-events: none; opacity: 0.5; }
</style>
</head>
<body>

<div id="paste-zone" tabindex="0">
  <span class="decor" style="top:12px;left:16px;">∫</span>
  <span class="decor" style="top:14px;right:18px;">π</span>
  <span class="decor" style="bottom:14px;left:20px;">√</span>
  <span class="decor" style="bottom:12px;right:16px;">∞</span>
  <div class="icon">⌨️</div>
  <div class="hint">Ctrl + V 粘贴截图</div>
  <div class="tip" id="tip">点击此区域可锁定焦点，全局粘贴无需点击</div>
</div>

<script>
  const zone  = document.getElementById("paste-zone");
  const tipEl = document.getElementById("tip");

  /* ══════════════════════════════════════════════════
   * Streamlit 组件通信协议
   * 正确顺序：
   *   1. window.onload 后发送 componentReady
   *   2. 收到 streamlit:render 后刷新高度
   *   3. 有值时发送 setComponentValue
   * ══════════════════════════════════════════════════ */

  /* ── Streamlit 消息必须携带 isStreamlitMessage: true，否则被过滤 ── */
  function sendToStreamlit(type, payload) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type }, payload),
      "*"
    );
  }

  function setFrameHeight() {
    sendToStreamlit("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 });
  }

  function sendValue(val) {
    sendToStreamlit("streamlit:setComponentValue", { value: val, dataType: "json" });
  }

  /* 收到 Streamlit render 事件时刷新高度（必须响应，否则判定为加载失败） */
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "streamlit:render") {
      setFrameHeight();
    }
  });

  /* window.onload 后再发 componentReady，确保时序正确 */
  window.addEventListener("load", () => {
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
    zone.focus();
    /* 同源时尝试监听父页面粘贴事件（localhost 生效） */
    try { window.parent.document.addEventListener("paste", handlePaste); } catch (_) {}
  });

  /* ── 处理粘贴 ── */
  function handlePaste(e) {
    const items = (e.clipboardData || (e.originalEvent && e.originalEvent.clipboardData) || {}).items || [];
    for (const item of items) {
      if (item.kind === "file" && item.type.startsWith("image/")) {
        const blob   = item.getAsFile();
        const reader = new FileReader();
        reader.onloadend = () => {
          sendValue(reader.result);   // base64 data URL → 传给 Python
          zone.classList.remove("focused");
          zone.classList.add("pasted");
          tipEl.textContent = "✅ 图片已接收，正在识别…";
          setTimeout(() => {
            zone.classList.remove("pasted");
            zone.classList.add("focused");
            tipEl.textContent = "可继续粘贴新截图";
          }, 2500);
        };
        reader.readAsDataURL(blob);
        e.preventDefault();
        return;
      }
    }
  }

  /* ── 焦点样式 ── */
  zone.addEventListener("focus", () => {
    zone.classList.add("focused");
    tipEl.textContent = "焦点已锁定，直接按 Ctrl+V 粘贴";
  });
  zone.addEventListener("blur", () => {
    zone.classList.remove("focused");
    tipEl.textContent = "点击此区域可锁定焦点，全局粘贴无需点击";
  });

  /* ── 监听粘贴（iframe 内部 + document 两层保底）── */
  zone.addEventListener("paste", handlePaste);
  document.addEventListener("paste", handlePaste);

  /* 点击激活焦点 */
  zone.addEventListener("click", () => zone.focus());
</script>
</body>
</html>
